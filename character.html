<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주인공 캐릭터 시안</title>
  <style>
    body { margin: 0; background: #fff6ee; font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #3b2f2f; }
    h1 { text-align: center; font-size: 22px; margin: 24px 0 8px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 16px; }
    figure { margin: 0; background: #fff; border-radius: 20px; padding: 12px; width: 200px; text-align: center; box-shadow: 0 3px 0 #f0dcd2; }
    figure div { width: 176px; height: 238px; margin: 0 auto; }
    figure svg { width: 100%; height: 100%; }
    figcaption { margin-top: 6px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>주인공 캐릭터 시안</h1>
  <div class="row" id="row"></div>
  <script src="character.js"></script>
  <script>
    const list = [
      ['기본 (멍)', { face: 'blank', pose: 'stand' }],
      ['웃음 (활짝)', { face: 'laugh', pose: 'stand' }],
      ['브이 ✌️', { face: 'blank', pose: 'peace' }],
      ['볼콕', { face: 'cute', pose: 'stand' }],
      ['노가다 후 (지침)', { face: 'tired', pose: 'stand' }],
    ];
    document.getElementById('row').innerHTML = list.map(([name, o]) =>
      `<figure><div>${characterSVG(o)}</div><figcaption>${name}</figcaption></figure>`).join('');
  </script>
</body>
</html>
