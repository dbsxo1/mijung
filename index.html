<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffb84d">
  <title>알바 전전기</title>
  <meta name="description" content="알바를 전전하며 돈을 모아 사장님이 되는 클릭 + 방치형 키우기 게임">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 상단 -->
    <header class="top">
      <div class="wallet">
        <div class="money"><span class="won">₩</span><span id="money">0</span></div>
        <div class="ps" id="ps">초당 0원</div>
      </div>
      <div class="top-btns">
        <span class="career-chip hidden" id="careerChip"></span>
        <button id="sndBtn" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </header>

    <div class="stam">
      <div class="stam-bar"><div id="stamFill"></div></div>
      <span id="stamText">⚡ 100/100</span>
    </div>

    <nav class="maintabs">
      <button data-tab="work" class="on">💼 알바</button>
      <button data-tab="home">🏠 집</button>
    </nav>

    <!-- 장면 -->
    <section id="scene" class="scene">
      <div id="bg" class="bg"></div>
      <div id="crowd" class="crowd"></div>
      <div id="place" class="place-chip"></div>
      <div id="golden" class="golden-chip hidden"></div>
      <button id="char" class="char" aria-label="캐릭터"></button>
      <div id="hint" class="tap-hint">탭해서 일하기!</div>
      <div id="ev" class="ev-layer"></div>
      <div id="fx" class="fx-layer"></div>
    </section>

    <!-- 하단 패널 -->
    <nav id="subtabs" class="subtabs"></nav>
    <section id="panel" class="panel"></section>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="confetti" class="confetti"></div>

  <script src="sound.js"></script>
  <script src="char.js"></script>
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
